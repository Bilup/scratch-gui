<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" value="notranslate"><meta name="description" content="Bilup is a powerful Scratch mod that enhances your Scratch experience with advanced features and optimizations."/><meta property="og:title" content="Bilup - Refactoring freedom"/><meta property="og:description" content="Bilup is a powerful Scratch mod that enhances your Scratch experience with advanced features and optimizations."/><meta property="og:type" content="website"/><meta property="og:image" content="/images/apple-touch-icon.png"/><meta property="og:url" content="https://editor.bilup.org/"/><title>Bilup - Refactoring freedom</title><link rel="apple-touch-icon" href="/images/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><style>.splash-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .splash-screen[hidden] {
        display: none;
      }
      .splash-screen[data-theme="dark"] {
        background-color: #333;
        color: white;
      }
      .splash-screen > * {
        max-width: 80%;
      }
      .splash-spinner:after {
        content: " ";
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 50%;

        border-color: currentColor transparent currentColor transparent;

      }
      @keyframes splash-spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }

      .splash-error-title {
        font-weight: bold;
        font-size: 1.25rem;

      }
      .splash-error-title a {

      }
      .splash-error-title a:hover {
        color: #5AB8BC;
      }
      .splash-errors {
        font-family: 'Consolas', 'Monaco', monospace;

        max-width: 800px;
        width: 90%;
        max-height: 40vh;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 1rem;

      }

        opacity: 0.5;
        cursor: not-allowed;
      }</style></head><body><noscript><div class="splash-screen"><div><h1>Bilup requires JavaScript</h1><p>Consider using <a href="https://desktop.turbowarp.org/">TurboWarp Desktop</a> if you are afraid of remote JavaScript.</p></div></div></noscript><div class="splash-screen spash-waiting-for-js" hidden><div class="splash-spinner"></div><div class="splash-error-title" hidden>Something went wrong. <a href="https://github.com/Bilup/scratch-gui/issues" target="_blank" rel="noreferrer">Please report</a> with the information below.</div><div class="splash-errors" hidden></div><button class="splash-reset" hidden>with the information below.</button></div><div class="splash-errors" hidden></div><button class="splash-reset" hidden>Click here to reset caches (can fix some errors)</button><script>(function () {
        'use strict';

        var theme = '';
        var accent = '#75C1C4';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            theme = parsed.gui || 'light';
            accent = parsed.accent || accent;
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.querySelector('.spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        splash.style.color = accent;
        splash.hidden = false;

        var splashErrorTitle = document.querySelector('.splash-error-title');
        var splashError = document.querySelector('.splash-errors');
        var splashReset = document.querySelector('.splash-reset');

        var totalErrors = 0;
        window.onerror = function (event, source, line, col, err) {
          if (++totalErrors > 5) return; // dont bother logging more
          splashErrorTitle.hidden = splashError.hidden = splashReset.hidden = false;
          var el = document.createElement('div');
          el.textContent = 'Error (splash) in ' + source + ' (' + line + ':' + col + '): ' + err;
          splashError.appendChild(el);
        };

        splashReset.onclick = function () {
          splashReset.disabled = true;
          function hardRefresh() {
            var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
            // This is a functional cookie used so that we respond with Clear-Site-Data just once. No tracking.
            // Can't use nocache parameter to trigger this because people might accidentally bookmark that, and
            // then we would be clearing their cache on every visit.
            document.cookie = 'tw_clear_cache_once=1; max-age=60; path=/; samesite=strict; secure';
            location.replace(location.pathname + search + (search ? '&' : '?') + 'nocache=' + Math.floor(Math.random() * 10000000));
          }
          if ('serviceWorker' in navigator) {
            setTimeout(hardRefresh, 5000);
            navigator.serviceWorker.getRegistration("/")
              .then(function(registration) {
                if (registration) {
                  return registration.unregister();
                }
              })
              .then(hardRefresh)
              .catch(hardRefresh);
          } else {
            hardRefresh();
          }
        };

        window.SplashEnd = () => {
          splash.hidden = true;
          window.onerror = null;
        };
      })();</script><div id="app"></div><script src="/js/gleba/git-libs.85a1b9eb86a10635a4fb.js"></script><script src="/js/gleba/scratch-engine.35b2a2e8c626ba69d1b0.js"></script><script src="/js/gleba/scratch-paint.21f4fac336145845f4fb.js"></script><script src="/js/gleba/vendors~addon-settings~community~editor~embed~fullscreen~player.e095d2ab663fd9b6a120.js"></script><script src="/js/gleba/vendors~community~editor~embed~fullscreen~player.918d7640e066ada5b663.js"></script><script src="/js/gleba/vendors~editor~embed~fullscreen~player.8e948974cf640c6da2d1.js"></script><script src="/js/gleba/addon-settings~community~editor~embed~fullscreen~player.c00cbd216a0130fc1951.js"></script><script src="/js/gleba/community~editor~embed~fullscreen~player.31dcbe58d2d86636a6b3.js"></script><script src="/js/gleba/addon-settings~editor~embed~fullscreen~player.7bd4506b5323b7dcd03d.js"></script><script src="/js/gleba/editor~embed~fullscreen~player.caa8a92e7ecd36299d52.js"></script><script src="/js/gleba/editor~fullscreen~player.995b8fa4dcc92dec69cd.js"></script><script src="/js/gleba/fullscreen.80d83329a57f8c5ce836.js"></script></body></html>
