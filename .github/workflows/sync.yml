name: CI(sync-mw)

on:
  push:
    branches:
      - sync-mw
  pull_request:
    branches:
      - sync-mw

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          # Remove local-only link overrides that don't exist in CI
          node -e "
            const fs = require('fs');

            // 1. Remove link overrides from package.json
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            if (pkg.pnpm && pkg.pnpm.overrides) {
              for (const [key, val] of Object.entries(pkg.pnpm.overrides)) {
                if (typeof val === 'string' && val.startsWith('link:')) {
                  delete pkg.pnpm.overrides[key];
                }
              }
              fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            }

            // 2. Remove link overrides from pnpm-lock.yaml overrides section
            let lockfile = fs.readFileSync('./pnpm-lock.yaml', 'utf8');
            // Remove lines containing link: in the overrides section (between 'overrides:' and 'importers:')
            lockfile = lockfile.replace(/(overrides:\n)((?:\s+[^\n]+\n)*)/, (match, header, body) => {
              const cleanedBody = body.split('\n')
                .filter(line => !line.trim() || !line.includes('link:'))
                .join('\n');
              return header + cleanedBody;
            });
            fs.writeFileSync('./pnpm-lock.yaml', lockfile);

            console.log('Cleaned up local-only link overrides for CI');
          "
          pnpm install --no-frozen-lockfile

      - run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            static/microbit
            src/generated
            build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/sync-mw'

    steps:
    - name: Checkout repo (with push access)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: .

    - name: Deploy to sync-mw-web branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Backup build folder
        rm -rf /tmp/web-build
        mkdir -p /tmp/web-build
        cp -r /tmp/build/* /tmp/web-build/

        # Fetch sync-mw-web branch if exists
        git fetch origin sync-mw-web 2>/dev/null || true

        # Create orphan sync-mw-web branch if not exists, otherwise checkout
        if git show-ref --verify --quiet refs/remotes/origin/sync-mw-web; then
          git checkout sync-mw-web
        else
          git checkout --orphan sync-mw-web
        fi

        # Clean sync-mw-web branch (keep .git directory)
        find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

        # Copy build contents directly to root
        cp -r /tmp/web-build/* .

        # Add all files
        git add -A

        # Commit if changed
        git commit -m "chore: deploy web build from sync-mw" || echo "No changes"

        # Push to sync-mw-web branch
        git push origin sync-mw-web --force
