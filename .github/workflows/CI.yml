name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true
      - name: Install dependencies
        run: bun install
      # Update version.json
      - name: Update version.json
        run: |
          COMMIT_DATE=$(TZ='Asia/Shanghai' git log -1 --format=%cd --date=format:%Y-%m-%d)
          jq --arg date "$COMMIT_DATE" '.latest-date = $date' src/playground/about/version.json > tmp.json && mv tmp.json src/playground/about/version.json
          jq '.version_little = ((.version_little | tonumber) + 1 | tostring)' src/playground/about/version.json > tmp.json && mv tmp.json src/playground/about/version.json
      - run: npm run build
      # Save dist as artifact
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            static/microbit
            src/generated
            build
      # Temp: Save package-lock.json
      #- name: Upload package-lock.json
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: package-lock.json
      #    path: package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout repo (with push access)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: .

    # Temp: Download package-lock.json
    #- name: Download package-lock.json
    #  uses: actions/download-artifact@v4
    #  with:
    #    name: package-lock.json
    #    path: package-lock.json

    - name: Deploy to develop-builds
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Backup downloaded directories
        rm -rf /tmp/static /tmp/src /tmp/build
        mkdir -p /tmp/static /tmp/src /tmp/build
        cp -r static/microbit /tmp/static/
        cp -r src/generated /tmp/src/
        cp -r build /tmp/

        # Fetch all branches
        git fetch origin

        # Checkout or create develop-builds based on develop
        if git show-ref --verify --quiet refs/remotes/origin/develop-builds; then
          git checkout develop-builds
          git pull origin develop-builds
        else
          git checkout -b develop-builds origin/develop
        fi

        # Sync code with develop
        git merge origin/develop --no-edit

        # Replace directories
        rm -rf static/microbit src/generated build
        mkdir -p static/microbit src/generated build
        cp -r /tmp/static/microbit/* static/microbit/

        cp -r /tmp/src/generated/* src/generated/
        cp -r /tmp/build/* build/

        # Force add directories (ignore .gitignore)
        git add -f static/microbit src/generated build

        # Commit if changed
        git commit -m "chore: update build artifacts from develop" || echo "No changes"

        # Push
        git push origin develop-builds

    - name: Deploy to web branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Backup build folder
        rm -rf /tmp/web-build
        mkdir -p /tmp/web-build
        cp -r /tmp/build/* /tmp/web-build/

        # Fetch web branch if exists
        git fetch origin web 2>/dev/null || true

        # Create orphan web branch if not exists, otherwise checkout
        if git show-ref --verify --quiet refs/remotes/origin/web; then
          git checkout web
        else
          git checkout --orphan web
        fi

        # Clean web branch (keep .git directory)
        find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

        # Copy build contents directly to root
        cp -r /tmp/web-build/* .

        # Add all files
        git add -A

        # Commit if changed
        git commit -m "chore: deploy web build from develop" || echo "No changes"

        # Push to web branch
        git push origin web --force
