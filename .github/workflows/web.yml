name: Web Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop-builds]

permissions:
  contents: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo (with push access)
        uses: actions/checkout@v4
        with:
          ref: web
          fetch-depth: 0
          persist-credentials: true

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: /tmp/dist

      - name: Prepare web folder
        run: |
          # Extract only the build folder
          mkdir -p /tmp/web
          cp -r /tmp/dist/build/* /tmp/web/

          # Clean web branch
          rm -rf *
          rm -rf .??* 2>/dev/null || true

          # Copy new build
          cp -r /tmp/web/* .

      - name: Deploy to web branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if this is a new branch
          if ! git rev-parse --verify --quiet web; then
            echo "Creating new web branch..."
            git checkout --orphan web
            rm -rf .github LICENSE README.md package.json package-lock.json node_modules src static test scripts translation.json webpack.*.js *.mjs tsconfig.json .eslint* .nvmrc 2>/dev/null || true
          fi

          # Add all files
          git add -A

          # Commit
          git commit -m "chore: deploy build from ${{ github.event.workflow_run.head_branch }} @ ${{ github.sha }}" || echo "No changes to commit"

          # Push
          git push origin web --force